_schema-version: 3.3.0
ID: ai_cap
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: ai_cap-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: ai_cap-auth
      - name: ai_cap-aicore
      # processEmail writes to S/4 through the ABMY_INVOICE_REVIEW subaccount
      # destination (see cds.requires.ZUI_INVOICE_REVIEW_O4 in package.json).
      # Without this binding the srv module cannot resolve any destination, the
      # write target falls back to 'local', and there is no database in CF.
      - name: ai_cap-destination

  - name: ai_cap
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: ai_cap-auth
      - name: ai_cap-destination
      - name: ai_cap-html5-runtime
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

  - name: ai_cap-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: ai_capdocumentprocessing
          artifacts:
            - documentprocessing.zip
          target-path: app/
    requires:
      - name: ai_cap-auth
      - name: srv-api
      - name: ai_cap-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true

  # Makes the uploaded HTML5 app DISCOVERABLE by SAP Build Work Zone.
  #
  # The app-deployer above only uploads the app into the app-host repo — that is
  # enough to serve it through our own approuter, but Work Zone's Content Manager
  # does not look inside app-host instances. It finds apps through *destinations*
  # carrying `sap.cloud.service` + `html5-apps-repo.app_host_id`, which is what
  # this module creates. Without it `cf html5-list -d` does not list the app and
  # Content Manager has nothing to add.
  #
  # The two destinations are the pair Work Zone expects: `*_html_repo_host` tells
  # it which app-host holds the content, `*_uaa` how to get a user token for it.
  - name: ai_cap-destination-content
    type: com.sap.application.content
    build-parameters:
      no-source: true
    requires:
      - name: ai_cap-destination
        parameters:
          content-target: true
      - name: ai_cap-html5-repo-host
        parameters:
          service-key:
            name: ai_cap-html5-repo-host-key
      - name: ai_cap-auth
        parameters:
          service-key:
            name: ai_cap-auth-key
    parameters:
      content:
        instance:
          # `ignore` so a redeploy never clobbers destinations that already exist
          # in the subaccount (e.g. the hand-created ABMY_INVOICE_REVIEW_S4 one
          # that xs-app.json routes through).
          existing_destinations_policy: ignore
          destinations:
            - Name: ai_cap_invoicereview_html_repo_host
              ServiceInstanceName: ai_cap-html5-repo-host
              ServiceKeyName: ai_cap-html5-repo-host-key
              sap.cloud.service: abeam.invoicereview
            - Name: ai_cap_invoicereview_uaa
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: ai_cap-auth
              ServiceKeyName: ai_cap-auth-key
              sap.cloud.service: abeam.invoicereview

  - name: ai_capdocumentprocessing
    type: html5
    path: app/documentprocessing
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build
      supported-platforms:
        []

resources:
  - name: ai_cap-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: ai_cap-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
    requires:
      - name: app-api
  # SAP AI Core — backs DocumentProcessingService (LLM extraction). Binds the
  # existing AI Core instance already used in dev (see .cdsrc-private.json). If
  # your instance has a different name, change service-name below.
  - name: ai_cap-aicore
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: default_aicore
  # Bound to BOTH the approuter (UI reads: the /sap route in xs-app.json goes
  # through the ABMY_INVOICE_REVIEW_S4 destination) and the srv module
  # (processEmail writes: the ABMY_INVOICE_REVIEW destination). One credential
  # store for both directions — the CF user-provided service of the same name
  # is only used locally, by `cds watch --profile s4`.
  - name: ai_cap-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      # Required for the destinations created by ai_cap-destination-content to be
      # usable as an HTML5 app source (Work Zone / html5-apps-repo runtime).
      config:
        HTML5Runtime_enabled: true

  - name: ai_cap-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: ai_cap-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
